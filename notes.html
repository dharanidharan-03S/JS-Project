<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link href="notes.css" rel="stylesheet">
    <script src="notes.js" defer></script>
    <script src="https://kit.fontawesome.com/646be5f4dc.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Dosis:wght@200..800&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div>
            <h2 class="notecount">Notes</h2>
            <span class="count">0 notes<span>
        </div>
        <div class="iconcontainer">
            <div class="iconbackground1">
                <i class="fa-solid fa-a uppercase"></i>
            </div>
            <div class="iconbackground2">
                <i class="lowercase">a</i>
            </div>
            <div class="iconbackground3">
                <i class="fa-solid fa-italic italic"></i>
            </div>
            <div class="iconbackground4">
                <i class="fa-solid fa-bold bold"></i>
            </div>
        </div>
        <div class="theme">
            <i class="fa-solid fa-sun sun"></i>
        </div>
        <div class="circle">D</div>
        <h2 class="username"></h2>
        <div class="logout">
            <i class="fa-solid fa-right-from-bracket logouticon"></i>
        </div>
    </nav>
    <div class="app">
        <div class="sidebar">
            <div class="sidebartop">
                <button class="newbutton">+ New Note</button>
                <input class="searchnotes" type="text" placeholder="Search notes..."></input>
                <div class="groupingcontainer">
                    <button class="allbutton">All</button>
                    <button class="yesterdaybutton">Yesterday</button>
                    <button class="olderbutton">Older</button>
                </div>
            </div>
            <div class="noteslist">
                <div class="optioncontainer">
                </div>
                <div class="notescontainer"> No notes yet</div>
            </div>
        </div>
        <div class="editor hiddenclass">
            <div class="editortop">
                <input class="titleinput" type="text" placeholder="untitled note">
                <span class="saveindicator">Saved</span>
            </div>
            <div class="date"></div>
            <div class="notebody">
                <textarea class="notes" placeholder="Start writing..." spellcheck="true" cont></textarea>
                <div class="wordcount">0 word . 0 characters</div>
            </div>
        </div>
        <div class="startdisplay">
            <h2 class="noteicon">✦</h2>
            <p class="selectnote">Select or create note</p>
            <p class="detail">Your notes stay private in your browser</p>
        </div>
    </div>
     <footer class="bottomcontainer">
        <p class="bottompara">&copy; 2026 Notes Saver.All rights reserved</p>
    </footer>
</body>
</html>
