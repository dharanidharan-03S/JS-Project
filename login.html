<html lang="en">

                    <i class="fa-solid fa-lock icon"></i>

                    <input id="password" type="password" class="passwordinput" placeholder="Enter the password">
                    <p class="wrongpassword">Incorrect password.Please try again</p>
                </div>
                <button class="signupbutton">Login</button>
            </form>
            <p class="login">Don't have Account? <a href="https://dharanidharans-9mzl75r7-8443.zcodecorp.in/HTML_CSS_DHARANIDHARAN/JS%20project/signup.html" class="link">Sign up</a></p>
        </div>
